<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Vault network policy after PR seven</title>
  <desc id="desc">VLT repository policy is Ethereum mainnet only, while the current SafeVault frontend still supports and defaults to Sepolia. The implementation must reconcile this mismatch.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08111f"/><stop offset="1" stop-color="#111a30"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".3"/></filter>
    <style>
      .h { font: 700 31px Inter, Arial, sans-serif; fill: #f6f9ff; }
      .t { font: 500 20px Inter, Arial, sans-serif; fill: #d7e5f5; }
      .s { font: 500 17px Inter, Arial, sans-serif; fill: #9db1cb; }
      .title { font: 700 25px Inter, Arial, sans-serif; fill: #fff; }
      .caps { font: 700 14px Inter, Arial, sans-serif; letter-spacing: 2px; fill: #7ed1ff; }
      .badge { font: 800 16px Inter, Arial, sans-serif; fill: #08111f; }
    </style>
  </defs>
  <rect width="1500" height="900" fill="url(#bg)"/>
  <text x="80" y="78" class="caps">NETWORK POLICY REVIEW · PR #7 MERGED</text>
  <text x="80" y="130" class="h">The policy is mainnet-only — but the frontend still needs alignment.</text>
  <text x="80" y="170" class="t">This is a configuration reconciliation issue, not evidence of a live deployment.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="250" width="570" height="420" rx="30" fill="#17374a" stroke="#39e6b0" stroke-width="3"/>
    <rect x="115" y="285" rx="12" width="175" height="38" fill="#39e6b0"/><text x="137" y="311" class="badge">AUTHORITATIVE</text>
    <text x="115" y="380" class="title">Vault Coin repository</text>
    <text x="115" y="425" class="t">Approved deployment network</text>
    <text x="115" y="480" class="h" font-size="34">Ethereum mainnet</text>
    <text x="115" y="522" class="t">Chain ID 1</text>
    <line x1="115" y1="555" x2="605" y2="555" stroke="#3d6573"/>
    <text x="115" y="600" class="s">Sepolia preflight workflow removed</text>
    <text x="115" y="632" class="s">No mainnet deployment entry point authorized</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="850" y="250" width="570" height="420" rx="30" fill="#382d35" stroke="#ffb36b" stroke-width="3"/>
    <rect x="885" y="285" rx="12" width="235" height="38" fill="#ffb36b"/><text x="905" y="311" class="badge">CURRENT FRONTEND</text>
    <text x="885" y="380" class="title">SafeVault deployment repo</text>
    <text x="885" y="425" class="t">Current supported chain IDs</text>
    <text x="885" y="480" class="h" font-size="31">1 + 11155111</text>
    <text x="885" y="522" class="t">Mainnet + Sepolia</text>
    <line x1="885" y1="555" x2="1375" y2="555" stroke="#765b55"/>
    <text x="885" y="600" class="s">Default currently remains Sepolia</text>
    <text x="885" y="632" class="s">Blockchain writes disabled in baseline</text>
  </g>

  <path d="M650 455 H840" stroke="#ffb36b" stroke-width="6" stroke-dasharray="14 12"/>
  <circle cx="745" cy="455" r="34" fill="#ffb36b"/>
  <text x="725" y="462" class="badge">!</text>
  <text x="672" y="515" class="s">RECONCILE BEFORE WALLET BUILD</text>

  <g>
    <rect x="200" y="760" width="1100" height="78" rx="18" fill="#12243c" stroke="#5ebcff" stroke-width="2"/>
    <text x="250" y="808" class="t">Recommended implementation decision:</text>
    <text x="690" y="808" class="title">mainnet-only VLT policy + explicit local/test mocks</text>
  </g>
</svg>