<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Vault non-custodial Ethereum mainnet architecture</title>
  <desc id="desc">A user-controlled wallet signs transactions. The Vault interface reads public data through RPC and sends only signed transactions to Ethereum mainnet. Private keys never enter Vault infrastructure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111b33"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#49b5ff"/>
      <stop offset="1" stop-color="#5967ff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39e6b0"/>
      <stop offset="1" stop-color="#2e9bff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#56b7ff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#39e6b0"/>
    </marker>
    <style>
      .h { font: 700 30px Inter, Arial, sans-serif; fill: #f6f9ff; }
      .t { font: 500 21px Inter, Arial, sans-serif; fill: #d4e1f4; }
      .s { font: 500 17px Inter, Arial, sans-serif; fill: #9db1cb; }
      .label { font: 700 16px Inter, Arial, sans-serif; fill: #091321; }
      .smallcaps { font: 700 15px Inter, Arial, sans-serif; letter-spacing: 2px; fill: #7ed1ff; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1350" cy="90" r="260" fill="#2344a8" opacity=".12"/>
  <circle cx="220" cy="820" r="300" fill="#008d9b" opacity=".10"/>
  <text x="80" y="78" class="smallcaps">VAULT · NON-CUSTODIAL MAINNET MODEL</text>
  <text x="80" y="128" class="h">The user signs. Vault coordinates.</text>
  <text x="80" y="165" class="t">Ethereum mainnet is the only approved VLT deployment network after PR #7.</text>

  <!-- User wallet -->
  <g filter="url(#shadow)">
    <rect x="80" y="300" rx="26" width="330" height="280" fill="#132743" stroke="#4db7ff" stroke-width="2"/>
    <rect x="110" y="335" rx="15" width="90" height="90" fill="url(#blue)"/>
    <path d="M135 382 h40 M145 360 v45 M165 360 v45" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".9"/>
    <text x="110" y="475" class="h" font-size="26">User wallet</text>
    <text x="110" y="510" class="t">MetaMask · Coinbase Wallet</text>
    <text x="110" y="542" class="t">Ledger · Trust Wallet</text>
    <text x="110" y="585" class="s">Private key stays here</text>
  </g>

  <!-- Vault -->
  <g filter="url(#shadow)">
    <rect x="555" y="235" rx="28" width="440" height="410" fill="#142d45" stroke="#39e6b0" stroke-width="2"/>
    <circle cx="775" cy="325" r="58" fill="url(#green)"/>
    <rect x="746" y="306" width="58" height="48" rx="10" fill="#092030"/>
    <path d="M760 306 v-14 a15 15 0 0 1 30 0 v14" fill="none" stroke="#092030" stroke-width="8"/>
    <circle cx="775" cy="330" r="6" fill="#39e6b0"/>
    <text x="595" y="435" class="h">Vault interface</text>
    <text x="595" y="472" class="t">Dashboard · assets · receive · send</text>
    <text x="595" y="508" class="t">Review · simulate · monitor</text>
    <line x1="595" y1="535" x2="955" y2="535" stroke="#36516b"/>
    <text x="595" y="575" class="s">No private keys · no seed phrases</text>
    <text x="595" y="608" class="s">No silent signing · no custodial balance ledger</text>
  </g>

  <!-- Read service -->
  <g filter="url(#shadow)">
    <rect x="1160" y="180" rx="24" width="340" height="210" fill="#182a46" stroke="#6684ff" stroke-width="2"/>
    <text x="1200" y="235" class="h" font-size="25">RPC / indexer</text>
    <text x="1200" y="275" class="t">Public chain reads</text>
    <text x="1200" y="308" class="t">Balances · history · gas</text>
    <text x="1200" y="341" class="s">May use one or more providers</text>
    <text x="1200" y="370" class="s">Cannot sign for the user</text>
  </g>

  <!-- Mainnet -->
  <g filter="url(#shadow)">
    <rect x="1110" y="535" rx="28" width="400" height="245" fill="#1a2643" stroke="#f0b45b" stroke-width="2"/>
    <circle cx="1170" cy="600" r="37" fill="#627eea"/>
    <path d="M1170 568 L1150 602 L1170 594 L1190 602 Z M1170 603 L1150 612 L1170 635 L1190 612 Z" fill="#fff" opacity=".92"/>
    <text x="1230" y="598" class="h" font-size="26">Ethereum mainnet</text>
    <text x="1230" y="635" class="t">Chain ID 1</text>
    <text x="1150" y="700" class="t">On-chain assets live here</text>
    <text x="1150" y="735" class="s">ETH · ERC-20 · NFTs · VLT when deployed</text>
  </g>

  <!-- VLT proxy -->
  <g>
    <rect x="1170" y="820" rx="15" width="280" height="52" fill="#f0b45b"/>
    <text x="1228" y="853" class="label">VLT ERC-1967 proxy</text>
  </g>

  <!-- arrows -->
  <path d="M410 405 C470 405 490 405 555 405" fill="none" stroke="#39e6b0" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <rect x="430" y="367" rx="12" width="105" height="32" fill="#39e6b0"/>
  <text x="452" y="389" class="label">sign</text>

  <path d="M995 320 C1060 300 1080 290 1160 290" fill="none" stroke="#56b7ff" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <rect x="1010" y="263" rx="12" width="112" height="32" fill="#56b7ff"/>
  <text x="1030" y="285" class="label">read</text>

  <path d="M995 560 C1045 600 1065 620 1110 650" fill="none" stroke="#39e6b0" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <rect x="1005" y="584" rx="12" width="145" height="32" fill="#39e6b0"/>
  <text x="1025" y="606" class="label">signed tx</text>

  <path d="M1305 780 L1305 820" fill="none" stroke="#f0b45b" stroke-width="4" marker-end="url(#arrowBlue)"/>

  <!-- trust boundary -->
  <rect x="45" y="210" width="990" height="485" rx="36" fill="none" stroke="#39e6b0" stroke-width="2" stroke-dasharray="10 12" opacity=".6"/>
  <text x="75" y="690" class="smallcaps" fill="#39e6b0">USER / VAULT TRUST BOUNDARY</text>
  <text x="75" y="724" class="s">The signing key never crosses into the Vault frontend, backend, RPC provider, or repository.</text>
</svg>